name: ubi10-git-pr
on:
  pull_request:
    paths:
      - utilities/ubi10-git/**
      - .github/workflows/ubi10-git-pr.yaml

# Declare default permissions as read only.
permissions: read-all

jobs:
  build:
    env:
      context: utilities/ubi10-git
      image_name: ubi10-git
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Check and verify version.json
        id: check_version
        uses: redhat-cop/github-actions/get-image-version@cc45c69b6655161f278271cd0c68ddcc1444a3f8 # v4.6
        with:
          IMAGE_CONTEXT_DIR: ${{ env.context }}

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ env.context }}/Dockerfile
          ignore: DL3041

      - name: Install qemu dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          context: ${{ env.context }}
          dockerfiles: |
            ./${{ env.context }}/Dockerfile
          image: ${{ env.image_name }}
          platforms: linux/amd64,linux/arm64
          oci: true
          tags: ${{ steps.check_version.outputs.IMAGE_TAGS }}

      - name: Test image
        env:
          IMAGE_VERSION: ${{ steps.check_version.outputs.VERSION }}
        run: |
          image="${image_name}:${IMAGE_VERSION}"
          echo "Running: podman run --rm ${image} git --version"
          podman run --rm "${image}" git --version
          echo "Checking the process is not root"
          podman run --rm "${image}" bash -c 'uid=""; while read -r key value _; do if [[ "$key" == "Uid:" ]]; then uid="$value"; fi; done < /proc/self/status; test "$uid" = 1001'
          echo "Checking git runs as an arbitrary non-root uid"
          podman run --rm --user 65532:0 "${image}" git --version

      - name: Install Syft
        run: |
          version="1.54.0"
          archive="syft_${version}_linux_amd64.tar.gz"
          expected="54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860"
          curl -fsSL -o "${archive}" "https://github.com/anchore/syft/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" syft
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Generate SBOMs
        env:
          IMAGE_VERSION: ${{ steps.check_version.outputs.VERSION }}
        run: |
          mkdir -p sbom
          manifest="${image_name}:${IMAGE_VERSION}"
          podman manifest inspect "${manifest}" > /tmp/image-manifest.json
          python3 << 'PY'
          import json, os, pathlib, subprocess
          image_name = os.environ["image_name"]
          document = json.load(open("/tmp/image-manifest.json"))
          entries = []
          for item in document.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              if not os_name or not architecture or architecture == "unknown":
                  continue
              entries.append((f"{os_name}/{architecture}", item["digest"]))
          if not entries:
              raise SystemExit(f"No platform images found for {image_name}")
          for platform, digest in entries:
              filename = f"sbom/{image_name}-{platform.replace('/', '-')}.spdx.json"
              archive = f"/tmp/{image_name}-{platform.replace('/', '-')}.tar"
              subprocess.run(["podman", "save", "--format", "oci-archive", "-o", archive, digest], check=True)
              subprocess.run(["syft", f"oci-archive:{archive}", "-o", f"spdx-json={filename}"], check=True)
              if pathlib.Path(filename).stat().st_size == 0:
                  raise SystemExit(f"Empty SBOM: {filename}")
              os.remove(archive)
          PY

      - name: Upload SBOMs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ubi10-git-sbom
          path: sbom/*.spdx.json
          retention-days: 14
