---
name: toolbox-pr
on:
  pull_request:
    paths:
      - tool-box/**
      - .github/workflows/toolbox-pr.yaml

# Declare default permissions as read only.
permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "4.19"
            tags: "4.19"
            oc: "4.19.49"
            helm: "v4.1.4"
          - tag: "4.20"
            tags: "4.20"
            oc: "4.20.40"
            helm: "v4.2.4"
          - tag: "4.21"
            tags: "4.21"
            oc: "4.21.35"
            helm: "v4.3.0"
          - tag: "4.22"
            tags: "4.22 latest"
            oc: "4.22.16"
            helm: "v4.3.0"
    env:
      context: tool-box
      image_name: toolbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Check and verify version.json
        id: check_version
        uses: redhat-cop/github-actions/get-image-version@cc45c69b6655161f278271cd0c68ddcc1444a3f8 # v4.6
        with:
          IMAGE_CONTEXT_DIR: ${{ env.context }}

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ env.context }}/Dockerfile
          ignore: DL3041,SC2174

      - name: Build image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          context: ${{ env.context }}
          dockerfiles: |
            ./${{ env.context }}/Dockerfile
          image: ${{ env.image_name }}
          oci: true
          tags: ${{ matrix.tags }}
          build-args: |
            OC_VERSION=${{ matrix.oc }}
            HELM_VERSION=${{ matrix.helm }}

      - name: Test image
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          image="${image_name}:${IMAGE_TAG}"
          podman run "${image}" oc version --client
          podman run "${image}" kubectl version --client
          podman run "${image}" helm version
          podman run "${image}" tkn version
